name: CI

on:
  push:
    branches:
      - version-16
      - main
  pull_request:
    branches:
      - version-16
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Python 3.14 is required: the codebase uses PEP 758 syntax
      # (except A, B) and the check-ast hook parses with the runner interpreter.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install pre-commit
        run: pip install -U pre-commit

      # prettier is skipped for now: the existing JS is not prettier-clean
      # (its reformatting is tracked separately). Lint still runs ruff, eslint
      # and the generic file checks.
      - name: Lint
        run: SKIP=prettier pre-commit run --color=always --all-files

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      REDIS_CACHE: redis://127.0.0.1:6379
      REDIS_QUEUE: redis://127.0.0.1:6380
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: "123"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -p123"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis-cache:
        image: redis:alpine
        ports:
          - 6379:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 6380:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev pkg-config build-essential

      - name: Install bench
        run: pip install frappe-bench

      - name: Init bench
        run: |
          bench init --skip-redis-config-generation \
            --frappe-branch version-16 \
            --python python3.14 \
            frappe-bench

      - name: Configure services
        run: |
          cd frappe-bench
          bench set-config -g db_host "$DB_HOST"
          bench set-config -gp db_port "$DB_PORT"
          bench set-config -g redis_cache "$REDIS_CACHE"
          bench set-config -g redis_queue "$REDIS_QUEUE"
          bench set-config -g redis_socketio "$REDIS_QUEUE"

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-v1
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Configure Yarn
        run: |
          yarn config set network-timeout 600000
          yarn config set network-concurrency 1

      - name: Get ERPNext (required by itemflow)
        run: |
          cd frappe-bench
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt: bench get-app erpnext"
            if bench get-app erpnext --branch version-16 --overwrite; then
              exit 0
            fi
            rm -rf apps/erpnext
            sleep $((attempt * 20))
          done
          exit 1

      - name: Link app into bench
        run: |
          ln -s "$GITHUB_WORKSPACE" frappe-bench/apps/itemflow
          cd frappe-bench
          bench setup requirements

      - name: Create site and install app
        run: |
          cd frappe-bench
          bench new-site test_site \
            --db-root-username root \
            --db-root-password 123 \
            --db-host "$DB_HOST" \
            --mariadb-user-host-login-scope '%' \
            --admin-password admin
          bench --site test_site install-app itemflow
          bench --site test_site set-config allow_tests true

      - name: Run tests
        run: |
          cd frappe-bench
          bench --site test_site run-tests --app itemflow

      - name: Build assets
        run: |
          cd frappe-bench
          bench build --app itemflow

  js-test:
    name: JS unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install yarn
        run: npm install -g yarn

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Run vitest
        run: yarn test
